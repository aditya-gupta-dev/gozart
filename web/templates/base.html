<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} - {{end}}Gozart Autonomous Video Engine</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <script src="/static/js/htmx.min.js"></script>
</head>
<body>
  <header class="nav-header">
    <div class="container nav-container">
      <a href="/" class="nav-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Gozart</span>
        <span class="nav-logo-badge">v2.0 Auto</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link {{if eq .ActiveNav "dashboard"}}active{{end}}">Dashboard</a>
        <a href="/new" class="nav-link {{if eq .ActiveNav "new"}}active{{end}}">+ New Pipeline</a>
        <a href="/settings" class="nav-link {{if eq .ActiveNav "settings"}}active{{end}}">Settings</a>
        <a href="/new" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Create Video
        </a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    {{template "content" .}}
  </main>
</body>
</html>
